name: Update Portfolio Submodule
on:
  push:
    branches: [main]

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          repository: harsh-dronie/Portfolio
          ssh-key: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
          submodules: false

      - name: Update submodule pointer
        run: |
          git config user.email "bot@antigravity.dev"
          git config user.name "AG Bot"
          git submodule update --init --remote clients/pro-athlete-fitness
          git add clients/pro-athlete-fitness
          git diff --cached --quiet || git commit -m "auto: update pro-athlete-fitness to $(date +%Y-%m-%d)"
          git push
